# .github/workflows/ci.yml (оптимизированная версия)
name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip" # 🆕 Кэш зависимостей

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test,grpc]'  # 🆕 editable + extras
          pip install pytest grpcio-tools

      - name: Generate gRPC stubs
        run: bash proto/generate.sh

      - name: Run unit tests
        run: pytest tests/unit -v --tb=short --cov=src --cov-report=term-missing

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests # 🆗 Только если unit прошли
    services:
      neo4j:
        image: neo4j:5.25 # 🆕 Конкретная версия
        env:
          NEO4J_AUTH: neo4j/password123
        options: >-
          --health-cmd "cypher-shell -u neo4j -p password123 'RETURN 1;'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 7474:7474 # 🆕 HTTP тоже
          - 7687:7687

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test,grpc,neo4j]'
          pip install pytest grpcio-tools neo4j

      - name: Generate gRPC stubs
        run: bash proto/generate.sh

      - name: Wait for Neo4j ready ✅
        run: |
          python -c "
          import time
          from neo4j import GraphDatabase
          for i in range(30):
              try:
                  driver = GraphDatabase.driver('bolt://localhost:7687', auth=('neo4j', 'password123'))
                  driver.verify_connectivity()
                  driver.close()
                  print('✅ Neo4j ready!')
                  break
              except:
                  time.sleep(2)
                  print(f'⏳ Waiting... {i+1}/30')
          else:
              raise Exception('Neo4j timeout')
          "

      - name: Run integration tests
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: password123
        run: pytest tests/integration -v -m integration --tb=short
